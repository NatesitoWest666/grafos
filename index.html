<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grafos Avanzado</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
}
canvas{
    background:white;
    border-radius:10px;
    margin-top:10px;
}
button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
.controls{
    margin-top:10px;
}
table{
    margin:auto;
    background:white;
    color:black;
    border-collapse:collapse;
}
td,th{
    border:1px solid black;
    padding:5px;
}
</style>
</head>
<body>

<h2>Editor de Grafos</h2>

<div class="controls">
<button onclick="setMode('node')">Agregar Nodo</button>
<button onclick="setMode('edge')">Agregar Arista</button>
<button onclick="setMode('loop')">Agregar Loop</button>
<button onclick="clearCanvas()">Limpiar</button>
<button onclick="saveGraph()">Grabar</button>
<button onclick="restoreGraph()">Restaurar</button>
<button onclick="exportJSON()">Exportar</button>
<input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
<button onclick="document.getElementById('importFile').click()">Importar</button>
</div>

<canvas id="canvas" width="800" height="500"></canvas>

<h3>Matriz de Adyacencia</h3>
<div id="matrix"></div>
<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let nodes = [];
let edges = [];
let mode = null;
let selectedNode = null;
let nodeId = 0;

function setMode(m){
    mode = m;
    selectedNode = null;
}

canvas.addEventListener("click", function(e){
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if(mode==="node"){
        let name = prompt("Nombre del nodo:");
        if(!name) return;
        nodeId++;
        nodes.push({id:nodeId,x,y,name});
        draw();
        generateMatrix();
    }

    else if(mode==="edge"){
        let node = getNode(x,y);
        if(!node) return;

        if(!selectedNode){
            selectedNode = node;
        } else {

            let input = prompt("Peso de la arista (solo números):");
            let weight = Number(input);

            if(isNaN(weight) || input.trim()===""){
                alert("Solo se permiten números.");
                selectedNode = null;
                return;
            }

            edges.push({from:selectedNode.id,to:node.id,weight});
            selectedNode=null;
            draw();
            generateMatrix();
        }
    }

    else if(mode==="loop"){
        let node = getNode(x,y);
        if(!node) return;

        let input = prompt("Peso del loop (solo números):");
        let weight = Number(input);

        if(isNaN(weight) || input.trim()===""){
            alert("Solo se permiten números.");
            return;
        }

        edges.push({from:node.id,to:node.id,weight});
        draw();
        generateMatrix();
    }
});

function getNode(x,y){
    return nodes.find(n=>Math.sqrt((n.x-x)**2+(n.y-y)**2)<20);
}

function drawArrow(fromX, fromY, toX, toY){
    const angle = Math.atan2(toY-fromY, toX-fromX);
    const headLength = 10;

    ctx.beginPath();
    ctx.moveTo(toX, toY);
    ctx.lineTo(
        toX - headLength * Math.cos(angle - Math.PI/6),
        toY - headLength * Math.sin(angle - Math.PI/6)
    );
    ctx.lineTo(
        toX - headLength * Math.cos(angle + Math.PI/6),
        toY - headLength * Math.sin(angle + Math.PI/6)
    );
    ctx.closePath();
    ctx.fill();
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    edges.forEach(edge=>{
        let from = nodes.find(n=>n.id===edge.from);
        let to = nodes.find(n=>n.id===edge.to);

        ctx.beginPath();
        ctx.strokeStyle="black";
        ctx.fillStyle="black";

        if(edge.from===edge.to){
            ctx.arc(from.x,from.y-35,20,0,2*Math.PI);
            ctx.stroke();
            ctx.fillText(edge.weight,from.x,from.y-55);
        } else {

            let reverse = edges.find(e=>e.from===edge.to && e.to===edge.from);

            if(reverse && edge.from < edge.to){
                let midX = (from.x + to.x)/2;
                let midY = (from.y + to.y)/2;

                let offset = 40;

                ctx.moveTo(from.x,from.y);
                ctx.quadraticCurveTo(midX,midY-offset,to.x,to.y);
                ctx.stroke();

                drawArrow(midX,midY-offset,to.x,to.y);
                ctx.fillText(edge.weight,midX,midY-offset);

            } 
            else if(reverse && edge.from > edge.to){

                let midX = (from.x + to.x)/2;
                let midY = (from.y + to.y)/2;

                let offset = -40;

                ctx.moveTo(from.x,from.y);
                ctx.quadraticCurveTo(midX,midY-offset,to.x,to.y);
                ctx.stroke();

                drawArrow(midX,midY-offset,to.x,to.y);
                ctx.fillText(edge.weight,midX,midY-offset);

            }
            else{
                ctx.moveTo(from.x,from.y);
                ctx.lineTo(to.x,to.y);
                ctx.stroke();

                drawArrow(from.x,from.y,to.x,to.y);

                ctx.fillText(edge.weight,(from.x+to.x)/2,(from.y+to.y)/2);
            }
        }
    });

    nodes.forEach(node=>{
        ctx.beginPath();
        ctx.arc(node.x,node.y,20,0,2*Math.PI);
        ctx.fillStyle="#3498db";
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle="white";
        ctx.fillText(node.name,node.x-10,node.y+5);
    });
}

</script>
</body>
</html>
