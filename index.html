<!DOCTYPE html>
<html>
<head>
  <title>Generador de Grafos</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    #network {
      width: 90%;
      height: 500px;
      border: 2px solid black;
      margin: auto;
    }

    button {
      margin: 8px;
      padding: 8px 15px;
      cursor: pointer;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

<h2>Generador de Grafos - Análisis de Algoritmos</h2>

<button onclick="agregarNodo()">Agregar Nodo</button>
<button onclick="agregarArista()">Agregar Arista</button>
<button onclick="agregarLoop()">Agregar Loop</button>
<button onclick="mostrarMatriz()">Mostrar Matriz de Adyacencia</button>
<button onclick="limpiar()">Limpiar Lienzo</button>

<div id="network"></div>

<div id="matriz"></div>

<script>

let nodes = new vis.DataSet([]);
let edges = new vis.DataSet([]);

let container = document.getElementById("network");

let data = {
  nodes: nodes,
  edges: edges
};

let options = {
  edges: {
    arrows: 'to',
    font: { align: 'middle' }
  }
};

let network = new vis.Network(container, data, options);

let contador = 1;

function agregarNodo() {
  nodes.add({
    id: contador,
    label: "Nodo " + contador
  });
  contador++;
}

function agregarArista() {
  if (nodes.length >= 2) {
    let from = Math.floor(Math.random() * nodes.length) + 1;
    let to = Math.floor(Math.random() * nodes.length) + 1;

    edges.add({
      from: from,
      to: to,
      label: "1"
    });
  }
}

function agregarLoop() {
  if (nodes.length >= 1) {
    let nodo = Math.floor(Math.random() * nodes.length) + 1;

    edges.add({
      from: nodo,
      to: nodo,
      label: "1"
    });
  }
}

function limpiar() {
  nodes.clear();
  edges.clear();
  contador = 1;
  document.getElementById("matriz").innerHTML = "";
}

function mostrarMatriz() {

  let cantidad = nodes.length;
  let matriz = [];

  // Crear matriz vacía
  for (let i = 0; i < cantidad; i++) {
    matriz[i] = [];
    for (let j = 0; j < cantidad; j++) {
      matriz[i][j] = 0;
    }
  }

  // Llenar con aristas
  edges.forEach(function(edge) {
    matriz[edge.from - 1][edge.to - 1] = 1;
  });

  // Crear tabla HTML
  let tabla = "<h3>Matriz de Adyacencia</h3>";
  tabla += "<table><tr><th></th>";

  for (let i = 1; i <= cantidad; i++) {
    tabla += "<th>" + i + "</th>";
  }

  tabla += "</tr>";

  for (let i = 0; i < cantidad; i++) {
    tabla += "<tr><th>" + (i+1) + "</th>";
    for (let j = 0; j < cantidad; j++) {
      tabla += "<td>" + matriz[i][j] + "</td>";
    }
    tabla += "</tr>";
  }

  tabla += "</table>";

  document.getElementById("matriz").innerHTML = tabla;
}

</script>

</body>
</html>
