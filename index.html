<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grafos Avanzado</title>

<style>
body{
    font-family: Arial;
    text-align:center;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    color:white;
}
canvas{
    background:white;
    border-radius:10px;
    margin-top:10px;
}
button{
    margin:5px;
    padding:8px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}
.controls{
    margin-top:10px;
}
table{
    margin:auto;
    background:white;
    color:black;
    border-collapse:collapse;
}
td,th{
    border:1px solid black;
    padding:5px;
}
</style>
</head>
<body>

<h2>Editor de Grafos</h2>

<div class="controls">
<button onclick="setMode('node')">Agregar Nodo</button>
<button onclick="setMode('edge')">Agregar Arista</button>
<button onclick="setMode('loop')">Agregar Loop</button>
<button onclick="clearCanvas()">Limpiar</button>
<button onclick="saveGraph()">Grabar</button>
<button onclick="restoreGraph()">Restaurar</button>
<button onclick="exportJSON()">Exportar</button>
<input type="file" id="importFile" style="display:none" onchange="importJSON(event)">
<button onclick="document.getElementById('importFile').click()">Importar</button>
</div>

<canvas id="canvas" width="800" height="500"></canvas>

<h3>Matriz de Adyacencia</h3>
<div id="matrix"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let nodes = [];
let edges = [];
let mode = null;
let selectedNode = null;
let nodeId = 0;

function setMode(m){
    mode = m;
    selectedNode = null;
}

canvas.addEventListener("click", function(e){
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if(mode==="node"){
        let name = prompt("Nombre del nodo:");
        if(!name) return;
        nodeId++;
        nodes.push({id:nodeId,x,y,name});
        draw();
        generateMatrix();
    }

    else if(mode==="edge"){
        let node = getNode(x,y);
        if(!node) return;

        if(!selectedNode){
            selectedNode = node;
        } else {
            let weight = parseInt(prompt("Peso de la arista:"));
            if(isNaN(weight)) weight = 1;
            edges.push({from:selectedNode.id,to:node.id,weight});
            selectedNode=null;
            draw();
            generateMatrix();
        }
    }

    else if(mode==="loop"){
        let node = getNode(x,y);
        if(!node) return;
        let weight = parseInt(prompt("Peso del loop:"));
        if(isNaN(weight)) weight = 1;
        edges.push({from:node.id,to:node.id,weight});
        draw();
        generateMatrix();
    }
});

function getNode(x,y){
    return nodes.find(n=>Math.sqrt((n.x-x)**2+(n.y-y)**2)<20);
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    edges.forEach(edge=>{
        let from = nodes.find(n=>n.id===edge.from);
        let to = nodes.find(n=>n.id===edge.to);

        ctx.beginPath();

        if(edge.from===edge.to){
            ctx.arc(from.x,from.y-30,20,0,2*Math.PI);
        } else {
            let reverse = edges.find(e=>e.from===edge.to && e.to===edge.from);
            if(reverse){
                ctx.quadraticCurveTo(
                    (from.x+to.x)/2,
                    (from.y+to.y)/2 - 40,
                    to.x,to.y
                );
                ctx.moveTo(from.x,from.y);
            } else {
                ctx.moveTo(from.x,from.y);
                ctx.lineTo(to.x,to.y);
            }
        }

        ctx.stroke();

        ctx.fillStyle="black";
        ctx.fillText(edge.weight,(from.x+to.x)/2,(from.y+to.y)/2);
    });

    nodes.forEach(node=>{
        ctx.beginPath();
        ctx.arc(node.x,node.y,20,0,2*Math.PI);
        ctx.fillStyle="#3498db";
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle="white";
        ctx.fillText(node.name,node.x-10,node.y+5);
    });
}

function generateMatrix(){
    let n = nodes.length;
    let matrix = Array.from({length:n},()=>Array(n).fill(0));

    edges.forEach(edge=>{
        let i = nodes.findIndex(n=>n.id===edge.from);
        let j = nodes.findIndex(n=>n.id===edge.to);
        matrix[i][j]+=edge.weight;
    });

    let html="<table><tr><th></th>";

    nodes.forEach(node=>{
        html+="<th>"+node.name+"</th>";
    });

    html+="<th>Conteo</th><th>Suma</th></tr>";

    matrix.forEach((row,i)=>{
        let count=0;
        let sum=0;
        html+="<tr><th>"+nodes[i].name+"</th>";
        row.forEach(val=>{
            if(val!==0) count++;
            sum+=val;
            html+="<td>"+val+"</td>";
        });
        html+="<td>"+count+"</td><td>"+sum+"</td></tr>";
    });

    html+="<tr><th>Conteo Col</th>";
    for(let j=0;j<n;j++){
        let count=0;
        matrix.forEach(row=>{
            if(row[j]!==0) count++;
        });
        html+="<td>"+count+"</td>";
    }
    html+="<td></td><td></td></tr>";

    html+="<tr><th>Suma Col</th>";
    for(let j=0;j<n;j++){
        let sum=0;
        matrix.forEach(row=>{
            sum+=row[j];
        });
        html+="<td>"+sum+"</td>";
    }
    html+="<td></td><td></td></tr>";

    html+="</table>";
    document.getElementById("matrix").innerHTML=html;
}

function clearCanvas(){
    nodes=[];
    edges=[];
    nodeId=0;
    draw();
    generateMatrix();
}

function saveGraph(){
    localStorage.setItem("grafoGuardado",JSON.stringify({nodes,edges,nodeId}));
    alert("Grafo grabado correctamente");
}

function restoreGraph(){
    let data = localStorage.getItem("grafoGuardado");
    if(!data) return alert("No hay datos guardados");
    let obj = JSON.parse(data);
    nodes=obj.nodes;
    edges=obj.edges;
    nodeId=obj.nodeId;
    draw();
    generateMatrix();
}

function exportJSON(){
    let data = JSON.stringify({nodes,edges});
    let blob = new Blob([data],{type:"application/json"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download="grafo.json";
    a.click();
}

function importJSON(event){
    let file = event.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload=function(e){
        let obj = JSON.parse(e.target.result);
        nodes=obj.nodes;
        edges=obj.edges;
        nodeId=nodes.length;
        draw();
        generateMatrix();
    }
    reader.readAsText(file);
}

generateMatrix();
</script>
</body>
</html>
