<!DOCTYPE html>
<html>
<head>
  <title>Editor Profesional de Grafos</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
    }

    h2 {
      margin-top: 20px;
    }

    .panel {
      margin: 15px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background-color: #ffffff;
      color: #2a5298;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ffd700;
      color: black;
    }

    .activo {
      background-color: #00ff99 !important;
      color: black !important;
    }

    #network {
      width: 95%;
      height: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
    }

    #matriz {
      margin-top: 20px;
      color: black;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
      width: 40px;
      text-align: center;
    }

  </style>
</head>
<body>

<h2>Editor Interactivo de Grafos</h2>

<div class="panel">
  <button id="btnNodo" onclick="activarModo('nodo')">Modo Nodo</button>
  <button id="btnArista" onclick="activarModo('arista')">Modo Arista</button>
  <button id="btnLoop" onclick="activarModo('loop')">Modo Loop</button>
  <button onclick="mostrarMatriz()">Mostrar Matriz</button>
  <button onclick="limpiar()">Limpiar</button>
</div>

<div id="network"></div>
<div id="matriz"></div>

<script>

let nodes = new vis.DataSet([]);
let edges = new vis.DataSet([]);

let container = document.getElementById("network");

let data = { nodes: nodes, edges: edges };

let options = {
  physics: false,
  edges: {
    arrows: { to: true },
    font: { align: "middle" }
  }
};

let network = new vis.Network(container, data, options);

let modo = "";
let contador = 1;
let nodoOrigen = null;

function activarModo(tipo) {
  modo = tipo;
  nodoOrigen = null;

  document.querySelectorAll("button").forEach(b => b.classList.remove("activo"));

  if(tipo === "nodo") document.getElementById("btnNodo").classList.add("activo");
  if(tipo === "arista") document.getElementById("btnArista").classList.add("activo");
  if(tipo === "loop") document.getElementById("btnLoop").classList.add("activo");
}

network.on("click", function(params) {

  // CREAR NODO DONDE HACES CLIC
  if(modo === "nodo" && params.nodes.length === 0) {
    let position = params.pointer.canvas;

    nodes.add({
      id: contador,
      label: "Nodo " + contador,
      x: position.x,
      y: position.y,
      fixed: true
    });

    contador++;
  }

  // CREAR ARISTA MANUAL
  if(modo === "arista" && params.nodes.length > 0) {

    if(nodoOrigen === null) {
      nodoOrigen = params.nodes[0];
    } else {
      let peso = prompt("Ingrese peso:", Math.floor(Math.random()*9)+1);
      if(peso === null || peso === "") return;

      edges.add({
        from: nodoOrigen,
        to: params.nodes[0],
        label: peso
      });

      nodoOrigen = null;
    }
  }

  // CREAR LOOP MANUAL
  if(modo === "loop" && params.nodes.length > 0) {

    let peso = prompt("Ingrese peso del loop:", Math.floor(Math.random()*9)+1);
    if(peso === null || peso === "") return;

    edges.add({
      from: params.nodes[0],
      to: params.nodes[0],
      label: peso
    });
  }

});

function mostrarMatriz() {

  let cantidad = nodes.length;
  let matriz = [];

  for(let i=0; i<cantidad; i++) {
    matriz[i] = [];
    for(let j=0; j<cantidad; j++) {
      matriz[i][j] = 0;
    }
  }

  edges.forEach(function(edge) {
    matriz[edge.from-1][edge.to-1] = edge.label;
  });

  let tabla = "<h3>Matriz de Adyacencia</h3>";
  tabla += "<table><tr><th></th>";

  for(let i=1; i<=cantidad; i++) {
    tabla += "<th>"+i+"</th>";
  }

  tabla += "</tr>";

  for(let i=0; i<cantidad; i++) {
    tabla += "<tr><th>"+(i+1)+"</th>";
    for(let j=0; j<cantidad; j++) {
      tabla += "<td>"+matriz[i][j]+"</td>";
    }
    tabla += "</tr>";
  }

  tabla += "</table>";

  document.getElementById("matriz").innerHTML = tabla;
}

function limpiar() {
  nodes.clear();
  edges.clear();
  contador = 1;
  nodoOrigen = null;
  document.getElementById("matriz").innerHTML = "";
}

</script>

</body>
</html>
